---
format:
  line_width: 100
  tab_size: 2
  line_ending: unix
  max_subgroups_hwrap: 2
  enable_sort: true
  autosort:
    groups:
      - '*'
      - cache_vars
      - commands
      - depends
      - include_dirs
      - sources
      - structure
      - system_includes
      - test
    horizontal_group_order: false
