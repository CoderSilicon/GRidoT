repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=512']
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        files: '^src/.*\.(cpp|h|hpp)$'
        types_or: [c, c++]

  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        files: '(^CMakeLists\.txt$|\.cmake$|\.cmake\.in$)'

  - repo: local
    hooks:
      - id: cmake-configure
        name: cmake configure
        entry: bash -c 'cmake -S . -B .cache/precommit -DCMAKE_BUILD_TYPE=Debug'
        language: system
        pass_filenames: false
        files: '(^CMakeLists\.txt$|^cmake/.*\.cmake$)'

      - id: cmake-build
        name: cmake build (warnings as errors)
        entry: bash -c 'cmake --build .cache/precommit -j2'
        language: system
        pass_filenames: false
        files: '^src/.*\.(cpp|h)$'

      - id: forbid-tabs-in-cpp
        name: no tabs in C++ sources
        entry: bash -c '! grep -Pn "\t" --include="*.cpp" --include="*.h" src'
        language: system
        types_or: [c, c++]