name: Feature request

description: Suggest a new capability for gridot

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to find out about your system that gridot cannot tell you?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should gridot do instead? Include the command line and sample output.
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Which command does this affect?
      options:
        - scan
        - track / untrack
        - groups
        - output format (--json)
        - new command
    validations:
      required: true

  - type: checkboxes
    id: alternatives
    attributes:
      label: Alternatives
      options:
        - label: I checked whether deborphan, aptitude or apt-mark already does this.

  - type: checkboxes
    id: read-only
    attributes:
      label: Constraints
      options:
        - label: The feature keeps gridot read-only (no installs, no removals).
          required: true
        - label: The feature needs no new runtime dependency beyond dpkg and libstdc++.
          required: true